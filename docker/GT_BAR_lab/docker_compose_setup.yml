version: '2'
services:
  moveit-service-setup-assistant:
    image: gramaziokohler/ros-noetic-dfab
    container_name: moveit-service-setup-assistant
    environment:
      - ROS_HOSTNAME=moveit-service-setup-assistant
      - ROS_MASTER_URI=http://ros-core:11311
      # GUI: To forward the GUI to an external X11 server (eg. XMing), uncomment the following line
      - DISPLAY=host.docker.internal:0.0
    depends_on:
      - ros-core
    volumes:
      - ./robot_cell_support:/root/catkin_ws/src/robot_cell_support
      - ./robot_cell_moveit_config:/root/catkin_ws/src/robot_cell_moveit_config
    command:
      - roslaunch
      - --wait
      - moveit_setup_assistant
      - setup_assistant.launch

  ros-core:
    image: gramaziokohler/ros-noetic-dfab
    container_name: ros-core
    ports:
      - "11311:11311"
    command:
      - roscore

  ros-bridge:
    image: gramaziokohler/ros-noetic-dfab
    container_name: ros-bridge
    environment:
      - "ROS_HOSTNAME=ros-bridge"
      - "ROS_MASTER_URI=http://ros-core:11311"
    ports:
      - "9090:9090"
    depends_on:
      - ros-core
    command:
      - roslaunch
      - --wait
      - rosbridge_server
      - rosbridge_websocket.launch

  ros-fileserver:
    image: gramaziokohler/ros-noetic-dfab
    container_name: ros-fileserver
    environment:
      - ROS_HOSTNAME=ros-fileserver
      - ROS_MASTER_URI=http://ros-core:11311
    depends_on:
      - ros-core
    volumes:
      - ./robot_cell_support:/root/catkin_ws/src/robot_cell_support
      - ./robot_cell_moveit_config:/root/catkin_ws/src/robot_cell_moveit_config
    command:
      - roslaunch
      - --wait
      - file_server
      - file_server.launch